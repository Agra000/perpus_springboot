# Profile alternatif tanpa MySQL: jalankan dengan
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Data disimpan di file ./data/perpustakaan (tetap ada setelah restart).
spring.datasource.url=jdbc:h2:file:./data/perpustakaan;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
