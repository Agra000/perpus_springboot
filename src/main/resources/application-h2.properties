# Profile alternatif tanpa PostgreSQL: di IntelliJ isi "Active profiles" = h2
# (atau: mvn spring-boot:run -Dspring-boot.run.profiles=h2)
# Data disimpan di file ./data/perpustakaan (tetap ada setelah restart).
spring.datasource.url=jdbc:h2:file:./data/perpustakaan;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
